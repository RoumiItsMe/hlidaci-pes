name: Hlídací pes

on:
  schedule:
    # GitHub Actions cron negarantuje přesný interval (zvlášť ve špičce
    # může být spuštění o pár minut později) — v praxi to ale sedí na +/- 15-30 min.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# Ať se nikdy nespustí dva běhy najednou (kdyby GitHub kvůli frontě spustil
# běh se zpožděním, který by se překryl s dalším) — druhý běh počká ve frontě
# místo souběžného zápisu do data/seen.json.
concurrency:
  group: hlidaci-pes-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Spustit hlídacího psa
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node index.js

      - name: Commit stav (data/seen.json), pokud se změnil
        run: |
          if ! git diff --quiet -- data/seen.json; then
            git config user.name "hlidaci-pes-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/seen.json
            git commit -m "chore: aktualizace stavu hlídacího psa [skip ci]"
            git push
          else
            echo "Stav beze změny, není co commitovat."
          fi
