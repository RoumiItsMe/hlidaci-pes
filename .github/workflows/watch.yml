name: Hlídací pes

on:
  schedule:
    # Schválně NE "*/15 * * * *" — kulaté časy (:00, :15, :30, :45) jsou
    # nejvytíženější sloty na celém GitHubu a spouštění se tam nejvíc
    # zpožďuje/přeskakuje (doporučená praxe GitHubu: posunout mimo kulaté
    # minuty). Tohle běží ve stejném intervalu (každých 15 min), jen na
    # :04/:19/:34/:49.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch: {}

# Ať se nikdy nespustí dva běhy najednou (kdyby GitHub kvůli frontě spustil
# běh se zpožděním, který by se překryl s dalším) — druhý běh počká ve frontě
# místo souběžného zápisu do data/seen.json.
concurrency:
  group: hlidaci-pes-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Spuštění + commit jsou v jednom skriptu (scripts/run-and-commit.sh), protože při
      # souběhu pushů se musí stav z tohoto běhu přenést přes nový stav z main.
      #
      # Proč: běh trvá i několik minut a mezitím může na main přibýt jiný commit (obyčejný push
      # z počítače, příležitostný překryv spouštěčů). `git push` pak dostane "fetch first".
      # Dřívější řešení stáhlo main, zahodilo stav a pustilo detekci znovu — jenže Telegram
      # zprávy prvního průchodu už odešly, takže druhý průchod poslal tytéž znovu (22. 10. 2026:
      # dvě změny ceny dvakrát, 4 zprávy místo 2). Teď detekce běží právě jednou a při
      # odmítnutém pushi se stav přenese přes main trojcestným sloučením (scripts/merge-seen.js).
      - name: Spustit hlídacího psa (stav se při souběhu pushů přenese, ne znovu spočítá)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Klíč k API edesky.cz (úřední desky obcí okresu, viz README).
          EDESKY_API_KEY: ${{ secrets.EDESKY_API_KEY }}
        run: |
          git config user.name "hlidaci-pes-bot"
          git config user.email "actions@users.noreply.github.com"
          bash scripts/run-and-commit.sh
