name: Hlídací pes

on:
  schedule:
    # Schválně NE "*/15 * * * *" — kulaté časy (:00, :15, :30, :45) jsou
    # nejvytíženější sloty na celém GitHubu a spouštění se tam nejvíc
    # zpožďuje/přeskakuje (doporučená praxe GitHubu: posunout mimo kulaté
    # minuty). Tohle běží ve stejném intervalu (každých 15 min), jen na
    # :04/:19/:34/:49.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch: {}

# Ať se nikdy nespustí dva běhy najednou (kdyby GitHub kvůli frontě spustil
# běh se zpožděním, který by se překryl s dalším) — druhý běh počká ve frontě
# místo souběžného zápisu do data/seen.json.
concurrency:
  group: hlidaci-pes-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Spuštění + commit jsou v jednom kroku (na rozdíl od dřívějška), protože
      # při konfliktu na push potřebujeme detekci znovu spustit nad čerstvě
      # staženým stavem — ne jen zkusit znovu `git push` se zastaralým diffem.
      #
      # Proč tenhle retry vůbec existuje: díky víc spouštěčům (cron-job.org
      # každých 15 min + příležitostný GitHubův bonusový `schedule` + ruční
      # spuštění) se může stát, že dva běhy skončí blízko sebe — typicky když
      # jeden neobvykle dlouho visí na "Install dependencies" (viděno naostro:
      # ~9 min misto obvyklých ~15s, pravděpodobně přechodná pomalost GitHub
      # runneru/npm registry). `concurrency` skupina níže běhy sekvencuje, ale
      # nezabrání tomu, aby jeden PŘESTO nestihl commitnout dřív, než druhý
      # (spuštěný mezitím) dokončí svůj push — `git push` pak dostane "fetch
      # first" odmítnutí. Řešení: stáhnout nejnovější stav a spustit detekci
      # ZNOVU nad ním (ne slepě rebasovat starý diff) — tím se garantuje, že
      # se nikdy nepošle duplicitní notifikace o inzerátu, který mezitím
      # zachytil a nahlásil ten druhý běh.
      - name: Spustit hlídacího psa (s retry při souběhu s jiným během)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "hlidaci-pes-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3; do
            node index.js
            SCRIPT_EXIT=$?
            if ! git diff --quiet -- data/seen.json; then
              git add data/seen.json
              git commit -m "chore: aktualizace stavu hlídacího psa [skip ci]"
              if git push; then
                echo "Push OK (pokus $i)."
                exit $SCRIPT_EXIT
              fi
              echo "Push selhal (pokus $i/3) — jiný běh mezitím pushnul. Stahuju nejnovější stav a zkouším detekci znovu."
              git fetch origin main
              git reset --hard origin/main
            else
              echo "Stav beze změny, není co commitovat."
              exit $SCRIPT_EXIT
            fi
          done
          echo "::error::Nepodařilo se commitnout stav ani po 3 pokusech (opakovaný souběh s jiným během)."
          exit 1
