name: Hlídací pes

on:
  schedule:
    # Schválně NE "*/15 * * * *" — kulaté časy (:00, :15, :30, :45) jsou
    # nejvytíženější sloty na celém GitHubu a spouštění se tam nejvíc
    # zpožďuje/přeskakuje (doporučená praxe GitHubu: posunout mimo kulaté
    # minuty). Tohle běží ve stejném intervalu (každých 15 min), jen na
    # :04/:19/:34/:49.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch: {}

# Ať se nikdy nespustí dva běhy najednou (kdyby GitHub kvůli frontě spustil
# běh se zpožděním, který by se překryl s dalším) — druhý běh počká ve frontě
# místo souběžného zápisu do data/seen.json.
concurrency:
  group: hlidaci-pes-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Spustit hlídacího psa
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node index.js

      # if: always() — stav (vč. health-tracking pro Telegram alerty) se musí
      # uložit i po neúspěšném běhu výše, jinak by se dedup alertů a "je to
      # zase OK" hlášky nezapisovaly a běh by o sobě nezanechal žádnou stopu.
      - name: Commit stav (data/seen.json), pokud se změnil
        if: always()
        run: |
          if ! git diff --quiet -- data/seen.json; then
            git config user.name "hlidaci-pes-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/seen.json
            git commit -m "chore: aktualizace stavu hlídacího psa [skip ci]"
            git push
          else
            echo "Stav beze změny, není co commitovat."
          fi
