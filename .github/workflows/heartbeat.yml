name: Hlídací pes — kontrola cronu

# Samostatný, nezávislý "hlídač hlídače" — hlavní workflow (watch.yml) se
# spoléhá na GitHub Actions cron, a ten se občas (hlavně u nových repo)
# nespustí sám vůbec, aniž by to GitHub jakkoli nahlásil (žádný běh =
# žádná chyba k nahlášení). Tenhle workflow běží na JINÉM rozvrhu (jednou
# za hodinu, jiný offset) a přes GitHub API kontroluje, kdy naposledy
# proběhl SKUTEČNÝ automatický (schedule) běh watch.yml. Když je to moc
# dávno, pošle o tom zvlášť označenou Telegram zprávu.
#
# Pozn.: pořád běží na stejné GitHub Actions infrastruktuře jako hlavní
# workflow, takže úplný výpadek celého GitHubu by srazil oba dva zároveň
# — pro tenhle zbytkový scénář by bylo potřeba externí "dead man's switch"
# (např. healthchecks.io), který běží mimo GitHub úplně. To je ale nad
# rámec toho, co jde nastavit bez založení účtu u třetí strany.

on:
  schedule:
    - cron: "13 * * * *" # jednou za hodinu, jiný offset než watch.yml (jiné vytížení GitHubu)
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Zkontrolovat poslední automatický běh watch.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          THRESHOLD_MIN=40 # hlavní cron běží ~každých 15 min — přes 40 min ticha = min. 2 zmeškané běhy v řadě

          LAST_RUN_AT=$(gh api "repos/${{ github.repository }}/actions/workflows/watch.yml/runs?event=schedule&per_page=1" --jq '.workflow_runs[0].created_at // empty')

          if [ -z "$LAST_RUN_AT" ]; then
            DIFF_MIN=999999
            echo "Ještě nikdy neproběhl žádný automatický (schedule) běh watch.yml."
          else
            NOW_EPOCH=$(date -u +%s)
            LAST_EPOCH=$(date -u -d "$LAST_RUN_AT" +%s)
            DIFF_MIN=$(( (NOW_EPOCH - LAST_EPOCH) / 60 ))
            echo "Poslední automatický běh watch.yml: $LAST_RUN_AT (před $DIFF_MIN min)."
          fi

          if [ "$DIFF_MIN" -gt "$THRESHOLD_MIN" ]; then
            echo "::warning::Automatický cron watch.yml neběžel přes $THRESHOLD_MIN minut — posílám Telegram alert."
            MSG=$(printf '🛎️ Hlídací pes — kontrola cronu: automatický běh (watch.yml) neproběhl už %s minut (čekal jsem max %s). GitHubu možná zase nenaskočil scheduled cron.\n\nZkontroluj: https://github.com/%s/actions/workflows/watch.yml' "$DIFF_MIN" "$THRESHOLD_MIN" "${{ github.repository }}")
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=$MSG" \
              -o /dev/null -w "Telegram sendMessage HTTP %{http_code}\n"
          else
            echo "V pořádku, cron běží podle rozvrhu."
          fi
