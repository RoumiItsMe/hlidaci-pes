name: Hlídací pes — kontrola cronu

# Samostatný, nezávislý "hlídač hlídače" — hlavní workflow (watch.yml) se
# primárně spoléhá na EXTERNÍ cron (cron-job.org), který ho spouští přes
# GitHub API (workflow_dispatch) — GitHub Actions vlastní `schedule`
# trigger se ukázal nespolehlivý (u tohohle repa nenaskočil hodiny po
# nasazení, viz README). `schedule` ve watch.yml zůstává jako bonusová
# záloha, ale primární spouštěč je teď mimo GitHub.
#
# Tenhle workflow běží na JINÉM rozvrhu (jednou za hodinu, jiný offset) a
# přes GitHub API kontroluje, kdy naposledy proběhl JAKÝKOLI běh watch.yml
# (ať už ho spustil cron-job.org, GitHubův schedule, nebo ruční spuštění)
# — pokud oba spouštěče selžou zároveň, dozvíme se o tom.
#
# Pozn.: pořád běží na stejné GitHub Actions infrastruktuře jako hlavní
# workflow, takže úplný výpadek celého GitHubu by srazil oba dva zároveň
# — to pokrývá právě externí cron-job.org trigger (běží mimo GitHub úplně).

on:
  schedule:
    - cron: "13 * * * *" # jednou za hodinu, jiný offset než watch.yml (jiné vytížení GitHubu)
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Zkontrolovat poslední běh watch.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          THRESHOLD_MIN=40 # hlavní cron běží ~každých 15 min — přes 40 min ticha = min. 2 zmeškané běhy v řadě

          LAST_RUN_AT=$(gh api "repos/${{ github.repository }}/actions/workflows/watch.yml/runs?per_page=1" --jq '.workflow_runs[0].created_at // empty')

          if [ -z "$LAST_RUN_AT" ]; then
            DIFF_MIN=999999
            echo "Ještě nikdy neproběhl žádný běh watch.yml."
          else
            NOW_EPOCH=$(date -u +%s)
            LAST_EPOCH=$(date -u -d "$LAST_RUN_AT" +%s)
            DIFF_MIN=$(( (NOW_EPOCH - LAST_EPOCH) / 60 ))
            echo "Poslední běh watch.yml: $LAST_RUN_AT (před $DIFF_MIN min)."
          fi

          if [ "$DIFF_MIN" -gt "$THRESHOLD_MIN" ]; then
            echo "::warning::watch.yml neběžel přes $THRESHOLD_MIN minut — posílám Telegram alert."
            MSG=$(printf '🛎️ Hlídací pes — kontrola cronu: watch.yml neproběhl už %s minut (čekal jsem max %s). Buď selhal externí cron-job.org spouštěč, nebo je výpadek na straně GitHubu.\n\nZkontroluj: https://github.com/%s/actions/workflows/watch.yml' "$DIFF_MIN" "$THRESHOLD_MIN" "${{ github.repository }}")
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=$MSG" \
              -o /dev/null -w "Telegram sendMessage HTTP %{http_code}\n"
          else
            echo "V pořádku, watch.yml běží podle rozvrhu."
          fi
