# Cloudový sběrač Trhu bytů. TOHLE JE ŠABLONA: zkopíruje se do SOUKROMÉHO repozitáře se snímky jako
# `.github/workflows/scout.yml` (postup v trh-bytu/cloud/README.md). Samotný kód sběrače se při každém běhu stáhne
# z veřejného repozitáře hlidaci-pes, takže se aktualizuje sám; do soukromého repa se ukládají jen snímky výpisů.
#
# Jednou denně stáhne výpisy portálů obou sekcí a uloží je jako snímky (snapshots/<region>/<čas>.json). Appka na PC je
# při dalším startu přehraje se skutečným časem pozorování (trh-bytu/snapshot-replay.js).
#
# SPOUŠTĚČ: primárně EXTERNÍ cron (cron-job.org → GitHub API `workflow_dispatch`), stejně jako u Hlídacího psa. GitHubův
# vlastní `schedule` je u tohoto účtu nespolehlivý (běhy chodí o hodiny později nebo vůbec — naměřeno 10/2026: místo
# každých 15 minut jen ~5 plánovaných běhů denně), proto je tady jen jako ZÁLOHA. Aby záloha nevyrobila druhý běh ve
# stejný den, plánovaný běh na začátku zkontroluje stáří posledního snímku a když je čerstvý, skončí.

name: Sběrač (Trh bytů)

on:
  schedule:
    # Záloha pro případ, že selže externí cron. Schválně ne na kulatou minutu (kulaté sloty jsou na GitHubu nejvytíženější).
    - cron: "17 3 * * *"
  workflow_dispatch: {}

# Dva běhy najednou by si šlapaly na zápis do repa.
concurrency:
  group: trh-bytu-scout
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Plánovaný (záložní) běh se přeskočí, když poslední snímek není starší než tolik hodin.
  FRESH_SNAPSHOT_HOURS: "12"

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Snímky (toto soukromé repo)
        uses: actions/checkout@v4
        with:
          path: data
          fetch-depth: 0 # stáří posledního snímku se čte z historie

      # Ruční a externí spuštění (workflow_dispatch) běží vždy; jen záloha přes `schedule` se při čerstvém snímku vzdá.
      - name: Je snímek čerstvý? (jen záložní plánovaný běh)
        id: fresh
        if: ${{ github.event_name == 'schedule' }}
        working-directory: data
        run: |
          last=$(git log -1 --format=%ct -- snapshots 2>/dev/null || true)
          last=${last:-0}
          age_h=$(( ( $(date -u +%s) - last ) / 3600 ))
          echo "Poslední snímek je starý ${age_h} h (limit ${FRESH_SNAPSHOT_HOURS} h)."
          if [ "$age_h" -lt "$FRESH_SNAPSHOT_HOURS" ]; then
            echo "Snímek je čerstvý — záložní běh se přeskakuje."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Kód sběrače (veřejné repo)
        if: ${{ steps.fresh.outputs.skip != 'true' }}
        uses: actions/checkout@v4
        with:
          repository: RoumiItsMe/hlidaci-pes
          path: code

      - name: Setup Node.js
        if: ${{ steps.fresh.outputs.skip != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: code/package-lock.json

      - name: Install dependencies
        if: ${{ steps.fresh.outputs.skip != 'true' }}
        working-directory: code
        run: npm ci

      # Každá sekce zvlášť a s `continue-on-error`: výpadek jedné nesmí zahodit druhou. Selhání se na konci přizná
      # (viz poslední krok), takže GitHub pošle e-mail o neúspěšném běhu.
      - name: Sběr — Ústí nad Orlicí
        id: usti
        if: ${{ steps.fresh.outputs.skip != 'true' }}
        continue-on-error: true
        working-directory: code
        env:
          TRH_REGION: default
        run: node trh-bytu/scout.js --out ../data/snapshots

      - name: Sběr — Náchod a Nové Město nad Metují
        id: nachod
        if: ${{ steps.fresh.outputs.skip != 'true' }}
        continue-on-error: true
        working-directory: code
        env:
          TRH_REGION: nachod
        run: node trh-bytu/scout.js --out ../data/snapshots

      - name: Uložení snímků
        if: ${{ steps.fresh.outputs.skip != 'true' }}
        working-directory: data
        run: |
          git config user.name "trh-bytu-scout"
          git config user.email "actions@users.noreply.github.com"
          git add snapshots
          if git diff --cached --quiet; then
            echo "Nic k uložení."
            exit 0
          fi
          git commit -m "chore: snímky výpisů $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Přiznat selhání sběru
        if: ${{ steps.usti.outcome == 'failure' || steps.nachod.outcome == 'failure' }}
        run: |
          echo "::error::Sběr některé sekce selhal (Ústí: ${{ steps.usti.outcome }}, Náchod: ${{ steps.nachod.outcome }}) — viz log kroků výš."
          exit 1
